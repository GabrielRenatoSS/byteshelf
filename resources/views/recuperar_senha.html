<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar senha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <img src="logo_retangular_azul.png" class="logo-top">
    </header>

    <div class="main">
        <div class="logo-area">
            <img src="logo_quadrado_azul.png" class="logo-big">
        </div>

        <div class="login-box">
            <h2>Recupere sua senha</h2>
            <label>E-mail institucional</label>
            
            <div class="input">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="seuemail@aluno.iffar.edu.br" id="email">
            </div>
            
            <button onclick="enviarEmail()">Confirmar</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
